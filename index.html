<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slumber Bear: Don't Wake Me Up!</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- TensorFlow.js & PoseNet (MoveNet) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000; /* ขอบดำถ้าย่อจอไม่พอดี 16:9 */
            font-family: 'Mali', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-container {
            position: relative;
            /* ล็อกสัดส่วน 16:9 เพื่อให้กรอบกล้องและไซเรนตรงกับภาพพื้นหลังเสมอ */
            aspect-ratio: 16 / 9;
            width: 100%;
            max-width: 177.78vh;
            max-height: 100vh;
            
            /* เปลี่ยนชื่อไฟล์ตรงนี้เป็นรูปภาพที่คุณเซฟไว้ เช่น url('bg.png') */
            background-image: url('bg5.png'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* =========================================
           1. ตั้งค่าตำแหน่งหลอดเสียง (ไซเรน)
           ========================================= */
        #meter-container {
            position: absolute;
            /* ปรับตัวเลข % ด้านล่างเพื่อให้กรอบตรงกับหลอดเสียงในรูปภาพของคุณ */
            top: 28.8%;     
            left: 6.2%;    
            width: 40.8%;   
            height: 3.2%;     
            z-index: 10;
        }
        
        .meter-fill {
            height: 100%;
            width: 0%;
            background: rgba(255, 0, 0, 0.5); /* สีแดงโปร่งแสง */
            border-radius: 20px;
            transition: width 0.1s linear;
        }

        #meter-siren {
            position: absolute;
            top: -30px;
            left: 70%;
            font-size: 2.5rem;
            transform: translateX(-50%);
            cursor: ew-resize;
            user-select: none;
            z-index: 20;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* =========================================
           2. ตั้งค่าตำแหน่งจอมือถือ (กล้อง AI)
           ========================================= */
        #phone-screen {
            position: absolute;
            /* ปรับตัวเลข % ด้านล่างเพื่อให้กล้องตรงกับกรอบหน้าจอในรูปภาพ bg5.png ของคุณ */
            top: 28.3%;
            left: 54.2%;
            width: 44.0%;
            height: 28.9%;
            z-index: 10;
            border-radius: 33px; 
            overflow: hidden;
            background: #000;
        }

        #webcam-video, #webcam-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        #webcam-canvas { z-index: 12; }

        #btn-switch-cam {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(255,255,255,0.8);
            border: none; border-radius: 10px;
            padding: 5px 10px; font-family: 'Mali', cursive;
            cursor: pointer; z-index: 20; display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* =========================================
           UI เสริม (แจ้งเตือน และปุ่มเริ่ม)
           ========================================= */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 50;
        }
        .btn-start-all {
            background: #ff5252; color: white; border: none;
            padding: 15px 30px; font-size: 1.5rem; font-family: 'Mali', cursive;
            border-radius: 20px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,82,82,0.5);
            transition: transform 0.2s;
        }
        .btn-start-all:hover { transform: scale(1.1); }
        
        #loading-ai {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 1.2rem; z-index: 40; display: none;
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px;
        }

        .wake-alert-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); padding: 30px 40px;
            border-radius: 30px; text-align: center;
            box-shadow: 0 15px 40px rgba(211,47,47,0.5); border: 6px solid #d32f2f;
            z-index: 100; display: none;
        }
        .wake-alert-overlay h2 { color: #c62828; font-size: 2.5rem; margin-bottom: 20px; }
        .btn-sleep-now {
            font-family: 'Mali', cursive; font-size: 1.5rem; padding: 15px 30px;
            background: #4caf50; color: white; border: none; border-radius: 15px; cursor: pointer;
        }

        .alert-flash { animation: flashRed 0.8s infinite; }
        @keyframes flashRed {
            0%, 100% { box-shadow: inset 0 0 0 0 rgba(255,0,0,0); }
            50% { box-shadow: inset 0 0 50px 20px rgba(255,0,0,0.6); }
        }

        #wake-counter {
            position: absolute;
            left: 104%; /* ห่างจากไซเรนเล็กน้อย (ไม่ชิดมาก) */
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5vw;
            color: #5c3a21; /* สีน้ำตาลเข้ม */
            font-weight: bold;
            background: #e6ccaa; /* พื้นหลังสีน้ำตาลอ่อน */
            padding: 5px 15px;
            border-radius: 15px;
            border: 2px solid #5c3a21;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- ไมโครโฟน: เกจวัดระดับเสียงและไซเรน -->
        <div id="meter-container">
            <div class="meter-fill" id="meter-fill"></div>
            <!-- เราใช้ไซเรนเป็นตัวเลื่อนปรับความไวของเสียง -->
            <div id="meter-siren" title="ลากเพื่อปรับระดับเสียงที่ทำให้หมีตื่น">🚨</div>
            
            <!-- ตัวนับจำนวนครั้งที่หมีตื่น (อยู่ใกล้หลอดเสียง) -->
            <div id="wake-counter">0</div>
        </div>

        <!-- วิดีโอหมีตื่น (แทนรูปหมีตอนหลับ) -->
        <video id="bear-roar-video" src="roar-bear3.mp4" playsinline muted style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 5; display: none; border-radius: inherit;"></video>

        <!-- กล้อง AI: หน้าจอมือถือ -->
        <div id="phone-screen">
            <video id="webcam-video" autoplay playsinline muted></video>
            <canvas id="webcam-canvas"></canvas>
            <button id="btn-switch-cam" onclick="switchCamera()"><i class="fas fa-sync-alt"></i> สลับกล้อง</button>
            <div id="loading-ai">
                <i class="fas fa-spinner fa-spin"></i> กำลังโหลด AI...
            </div>
        </div>

    </div>



    <!-- หน้าจอขอสิทธิ์การเข้าถึงกล้องและไมค์ -->
    <div class="start-overlay" id="start-overlay">
        <h2 style="color:white; margin-bottom: 20px;">ภารกิจหมีจำศีล (แบบภาพ Custom)</h2>
        <p style="color:white; margin-bottom: 30px;">(อย่าลืมนำรูปภาพของคุณมาวางในโฟลเดอร์และตั้งชื่อว่า <b>bg.png</b>)</p>
        <button class="btn-start-all" onclick="startSystem()"><i class="fas fa-play"></i> เริ่มระบบตรวจจับ</button>
    </div>

    <script>
        // ==========================================
        // 1. Audio / Decibel Meter Logic
        // ==========================================
        let audioContext, analyser, dataArray;
        let isListening = false;
        let threshold = 70;
        let overThresholdTime = 0;
        let lastTime = performance.now();
        let bearState = 'sleep';
        let gracePeriod = false;
        let wakeCount = 0;

        const meterContainer = document.getElementById('meter-container');
        const sirenIcon = document.getElementById('meter-siren');
        const meterFill = document.getElementById('meter-fill');
        let isDraggingSiren = false;

        // Custom Slider Logic for Siren
        sirenIcon.addEventListener('mousedown', (e) => {
            isDraggingSiren = true;
            e.preventDefault();
        });
        window.addEventListener('mouseup', () => { isDraggingSiren = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDraggingSiren) {
                const rect = meterContainer.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let pct = (x / rect.width) * 100;
                threshold = Math.max(0, Math.min(100, pct));
                sirenIcon.style.left = threshold + '%';
            }
        });

        // Touch events for iPad/Mobile
        sirenIcon.addEventListener('touchstart', (e) => {
            isDraggingSiren = true;
        }, {passive: true});
        window.addEventListener('touchend', () => { isDraggingSiren = false; });
        window.addEventListener('touchmove', (e) => {
            if (isDraggingSiren && e.touches.length > 0) {
                const rect = meterContainer.getBoundingClientRect();
                let x = e.touches[0].clientX - rect.left;
                let pct = (x / rect.width) * 100;
                threshold = Math.max(0, Math.min(100, pct));
                sirenIcon.style.left = threshold + '%';
            }
        }, {passive: true});

        function getVolume() {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let vol = sum / dataArray.length;
            return Math.min(100, (vol / 80) * 100);
        }

        function updateMeter(time) {
            if(!isListening) return;
            let dt = time - lastTime;
            lastTime = time;

            let vol = getVolume();
            meterFill.style.width = vol + '%';
            
            if (bearState !== 'awake' && !gracePeriod) {
                if (vol >= threshold) {
                    overThresholdTime += dt;
                    if (overThresholdTime > 1000) wakeUpBear();
                } else {
                    overThresholdTime = 0;
                }
            }
            requestAnimationFrame(updateMeter);
        }

        function wakeUpBear() {
            bearState = 'awake';
            wakeCount++;
            document.getElementById('wake-counter').innerText = wakeCount;
            document.getElementById('app-container').classList.add('alert-flash');
            
            // แสดงวิดีโอและเล่น
            const roarVideo = document.getElementById('bear-roar-video');
            roarVideo.style.display = 'block';
            roarVideo.currentTime = 0;
            roarVideo.play().catch(e => console.log("Video play failed", e));
            
            playWakeSound();
            
            // ปิดอัตโนมัติภายใน 3 วินาที
            setTimeout(() => {
                resetBear();
            }, 3000);
        }

        function resetBear() {
            bearState = 'sleep';
            overThresholdTime = 0;
            document.getElementById('app-container').classList.remove('alert-flash');
            
            // ซ่อนวิดีโอและหยุดเล่น
            const roarVideo = document.getElementById('bear-roar-video');
            roarVideo.style.display = 'none';
            roarVideo.pause();
            
            gracePeriod = true;
            setTimeout(() => { gracePeriod = false; }, 3000);
        }

        // ==========================================
        // 2. Camera & AI Tracking Logic
        // ==========================================
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('webcam-canvas');
        const ctx = canvas.getContext('2d');
        let detector;
        const personStates = {}; // id -> { standing: 0, back: 0, talk: 0, lastUpdate: time, alerted: false }
        
        let currentFacingMode = 'user';
        let currentVideoStream = null;

        async function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            
            if (currentVideoStream) {
                currentVideoStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentVideoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = currentVideoStream;
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };
            } catch(err) {
                alert("ไม่สามารถสลับกล้องได้");
            }
        }

        async function startSystem() {
            document.getElementById('start-overlay').style.display = 'none';
            
            // Audio setup
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
            
            // ปลดล็อคเสียงและวิดีโอสำหรับ iPad/iPhone (Warm-up)
            roarAudio.play().then(() => roarAudio.pause()).catch(e => {});
            const roarVid = document.getElementById('bear-roar-video');
            // เอา muted ออกเพื่อให้วิดีโอมีเสียงด้วยเผื่อต้องการ
            roarVid.muted = false;
            roarVid.play().then(() => roarVid.pause()).catch(e => {});
            
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const microphone = audioContext.createMediaStreamSource(audioStream);
                microphone.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isListening = true;
                lastTime = performance.now();
                requestAnimationFrame(updateMeter);
            } catch (err) {
                alert("ไม่สามารถเปิดไมโครโฟนได้");
            }

            // Video setup
            try {
                currentVideoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = currentVideoStream;
                document.getElementById('btn-switch-cam').style.display = 'block';
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    initAI();
                };
            } catch(err) {
                alert("ไม่สามารถเปิดกล้องได้");
            }
        }

        async function initAI() {
            document.getElementById('loading-ai').style.display = 'block';
            await tf.ready();
            const model = poseDetection.SupportedModels.MoveNet;
            const detectorConfig = {
                modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
                enableTracking: true,
                trackerType: poseDetection.TrackerType.BOUNDING_BOX
            };
            detector = await poseDetection.createDetector(model, detectorConfig);
            document.getElementById('loading-ai').style.display = 'none';
            requestAnimationFrame(detectPoses);
        }

        async function detectPoses() {
            if (!detector) return;
            
            let poses = [];
            try {
                poses = await detector.estimatePoses(video);
            } catch(e) {}
            
            const now = performance.now();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const pose of poses) {
                if (!pose.id) continue;
                
                let state = personStates[pose.id];
                if (!state) {
                    state = { standing: 0, back: 0, talk: 0, lastUpdate: now, alerted: false };
                    personStates[pose.id] = state;
                }
                let dt = now - state.lastUpdate;
                state.lastUpdate = now;
                
                const kp = {};
                pose.keypoints.forEach(k => { kp[k.name] = { score: k.score || 0, x: k.x, y: k.y }; });
                
                let isStanding = false;
                let isBack = false;
                let isTalk = false;
                
                let nose = kp.nose?.score || 0;
                let lEye = kp.left_eye?.score || 0;
                let rEye = kp.right_eye?.score || 0;
                let lShoulder = kp.left_shoulder?.score || 0;
                let rShoulder = kp.right_shoulder?.score || 0;
                let lKnee = kp.left_knee?.score || 0;
                let rKnee = kp.right_knee?.score || 0;

                // 1. Turning Back (มองไม่เห็นหน้า แต่เห็นไหล่)
                let faceScore = Math.max(nose, lEye, rEye);
                if (faceScore < 0.4 && (lShoulder > 0.3 || rShoulder > 0.3)) isBack = true;
                
                // 2. Talking (Profile face)
                if (!isBack && nose > 0.3) {
                    let lookingLeft = lEye > 0.4 && rEye < 0.2;
                    let lookingRight = rEye > 0.4 && lEye < 0.2;
                    if (lookingLeft || lookingRight) isTalk = true;
                }
                
                // 3. Standing
                if (pose.box) {
                    let ratio = pose.box.height / Math.max(1, pose.box.width);
                    if (ratio > 2.2 || lKnee > 0.5 || rKnee > 0.5) isStanding = true;
                }

                // Increment timers
                if (isStanding) state.standing += dt; else state.standing = 0;
                if (isBack) state.back += dt; else state.back = 0;
                if (isTalk) state.talk += dt; else state.talk = 0;
                
                // Draw Tracking Box
                if (pose.box) {
                    ctx.strokeStyle = 'rgba(76, 175, 80, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pose.box.xMin, pose.box.yMin, pose.box.width, pose.box.height);
                }
                
                // Check Rules
                let alertMsg = "";
                if (state.standing > 30000) alertMsg = "ลุกจากที่นั่ง! 👣";
                else if (state.back > 15000) alertMsg = "หันหลังเล่น! 🔍";
                else if (state.talk > 10000) alertMsg = "หันหน้าคุยกัน! 🐰";
                
                if (alertMsg && pose.box) {
                    drawCameraAlert(pose.box, alertMsg);
                    if (!state.alerted) {
                        playDingSound();
                        
                        // ปลุกหมีให้คำราม!
                        if (bearState === 'sleep' && !gracePeriod) {
                            wakeUpBear();
                        }
                        
                        state.alerted = true;
                    }
                } else {
                    state.alerted = false;
                }
            }
            
            // Clean up old tracked persons
            for (const id in personStates) {
                if (now - personStates[id].lastUpdate > 2000) {
                    delete personStates[id];
                }
            }
            
            requestAnimationFrame(detectPoses);
        }

        function drawCameraAlert(box, msg) {
            const x = box.xMin;
            const y = box.yMin > 40 ? box.yMin - 40 : box.yMax + 10;
            
            ctx.font = 'bold 22px Mali';
            const textWidth = ctx.measureText(msg).width;
            
            ctx.fillStyle = '#ff5252';
            ctx.beginPath();
            ctx.roundRect(x, y - 25, textWidth + 20, 35, 10);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.fillText(msg, x + 10, y - 2);
        }

        // ==========================================
        // 3. Synthesized Sounds
        // ==========================================
        function playDingSound() {
            if(!audioContext) return;
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            osc.start();
            osc.stop(audioContext.currentTime + 0.5);
        }

        const roarAudio = new Audio('Insane-Bear-Sounds.mp3');
        roarAudio.load(); // บังคับโหลดเผื่อไว้
        let roarTimeout;

        function playWakeSound() {
            roarAudio.currentTime = 0;
            let playPromise = roarAudio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // ตัดเสียงคำรามที่ 3 วินาที
                    clearTimeout(roarTimeout);
                    roarTimeout = setTimeout(() => {
                        roarAudio.pause();
                    }, 3000);
                }).catch(e => {
                    console.log("Audio play failed, fallback to synth", e);
                    synthRoar();
                });
            } else {
                synthRoar();
            }
        }

        function synthRoar() {
            if(!audioContext) return;
            const bufferSize = audioContext.sampleRate * 2; // 2 seconds
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1; // White noise
            }
            
            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;
            
            // Lowpass filter for a deep, rumbly roar
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(250, audioContext.currentTime); 
            filter.frequency.exponentialRampToValueAtTime(40, audioContext.currentTime + 1.5);
            
            // Gain for envelope
            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(0, audioContext.currentTime);
            gain.gain.linearRampToValueAtTime(1.5, audioContext.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioContext.destination);
            noise.start();
            
            // Add a sub-bass oscillator for the growl
            const osc = audioContext.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioContext.currentTime + 1.5);
            
            const oscGain = audioContext.createGain();
            oscGain.gain.setValueAtTime(0, audioContext.currentTime);
            oscGain.gain.linearRampToValueAtTime(1, audioContext.currentTime + 0.1);
            oscGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);
            
            osc.connect(oscGain);
            oscGain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 1.5);
        }
    </script>
</body>
</html>
